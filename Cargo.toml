[package]
name = "tokio-rustls"
version = "0.26.6"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rustls/tokio-rustls"
homepage = "https://github.com/rustls/tokio-rustls"
documentation = "https://docs.rs/tokio-rustls"
readme = "README.md"
description = "Asynchronous TLS/SSL streams for Tokio using Rustls."
categories = ["asynchronous", "cryptography", "network-programming"]
edition = "2021"
rust-version = "1.71"
exclude = ["/.github", "/examples", "/scripts", "/tests/"]

[dependencies]
rustls = { version = "0.24.0-dev.2", default-features = false, features = ["webpki"] }
tokio = "1.0"

[features]
default = ["tracing"]
brotli = ["rustls/brotli"]
early-data = []
tracing = ["rustls/tracing"]
zlib = ["rustls/zlib"]

[dev-dependencies]
argh = "0.1.1"
futures-util = "0.3.1"
rcgen = { version = "0.14", features = ["pem"] }
rustls-aws-lc-rs = { version = "0.24.0-dev.2" }
tokio = { version = "1.0", features = ["full"] }
webpki-roots = "1"

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    # ---
    "rustls",
    "rustls::*",
    "rustls_pki_types",
    "rustls_pki_types::*",
    "tokio::io::async_read::AsyncRead",
    "tokio::io::async_buf_read::AsyncBufRead",
    "tokio::io::async_write::AsyncWrite",
]
